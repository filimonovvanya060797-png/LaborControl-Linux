name: R11 schema exporter — PowerShell syntax

on:
  push:
    branches:
      - feature/r11-core-recovery-20261120
    paths:
      - 'tools/export_r11_schema.ps1'
      - '.github/workflows/r11-schema-exporter-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - name: Checkout without persistent credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate GitHub API download for slash-containing branch
        shell: powershell
        run: |
          $uri = 'https://api.github.com/repos/filimonovvanya060797-png/LaborControl-Linux/contents/tools/export_r11_schema.ps1?ref=feature/r11-core-recovery-20261120'
          $response = Invoke-RestMethod -Uri $uri -Headers @{ Accept = 'application/vnd.github+json'; 'User-Agent' = 'LaborControl-schema-exporter' }
          $downloaded = [System.Text.Encoding]::UTF8.GetString([System.Convert]::FromBase64String(($response.content -replace '\s', '')))
          $local = Get-Content -LiteralPath 'tools/export_r11_schema.ps1' -Raw
          if ($downloaded -ne $local) { throw 'GitHub API download differs from checked-out script.' }
          Write-Host 'GitHub API download OK; script content matches repository.'
      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $path = (Resolve-Path 'tools/export_r11_schema.ps1').Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
          Write-Host "PowerShell syntax OK: $path"
