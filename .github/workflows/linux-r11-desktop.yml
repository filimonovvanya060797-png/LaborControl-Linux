# Experimental desktop shell. Separate from the R11 Go controller workflow.
name: R11 native desktop GTK build
on:
  push:
    paths:
      - 'port/desktop/**'
      - 'port/controller/**'
      - '.github/workflows/linux-r11-desktop.yml'
  pull_request:
    paths:
      - 'port/desktop/**'
      - 'port/controller/**'
      - '.github/workflows/linux-r11-desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r11-gtk-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Compile GTK/WebKit desktop and Go R11 controller
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: port/controller/go.mod
          cache: false
      - name: Install Linux native desktop build requirements
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev xvfb xauth python3-gi gir1.2-webkit2-4.1
      - name: Verify scripts and desktop dependencies
        shell: bash
        run: |
          bash -n port/desktop/build.sh port/desktop/install-user.sh
          pkg-config --modversion gtk+-3.0 webkit2gtk-4.1
      - name: Check native R11 JavaScript screen rendering
        shell: bash
        run: |
          node --version
          node --check port/controller/tests/r11_ui_smoke.cjs
          node port/controller/tests/r11_ui_smoke.cjs
          node --check port/controller/tests/r11_gender_calendar_decimal_smoke.cjs
          node port/controller/tests/r11_gender_calendar_decimal_smoke.cjs
          node --check port/controller/tests/r11_file_picker_smoke.cjs
          node port/controller/tests/r11_file_picker_smoke.cjs
      - name: Run Go regression tests
        working-directory: port/controller
        env:
          CGO_ENABLED: '0'
        run: go test -count=1 ./...
      - name: Build isolated Linux desktop distribution
        shell: bash
        run: bash port/desktop/build.sh "$RUNNER_TEMP/laborcontrol-r11-desktop"
      - name: Check installer dependency failure and successful menu installation
        shell: bash
        run: bash port/desktop/tests/install_user_smoke.sh "$RUNNER_TEMP/laborcontrol-r11-desktop"
      - name: Check Russian native right-click menu and stock actions
        shell: bash
        run: |
          timeout 30s xvfb-run -a "$RUNNER_TEMP/laborcontrol-r11-desktop/laborcontrol-desktop" --check-context-ru
      - name: Run real WebKitGTK screen navigation on synthetic local database
        shell: bash
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: '1'
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$RUNNER_TEMP/r11-webkit-synthetic"
          export LABORCONTROL_DESKTOP_MODE=1
          export LABORCONTROL_DESKTOP_TOKEN="github-actions-ui-test"
          mkdir -p "$XDG_DATA_HOME"
          "$RUNNER_TEMP/laborcontrol-r11-desktop/laborcontrol-controller" > "$RUNNER_TEMP/r11-webkit-backend.log" 2>&1 &
          BACKEND_PID=$!
          trap 'curl -s -X POST http://127.0.0.1:8779/api/shutdown >/dev/null || true; kill "$BACKEND_PID" 2>/dev/null || true; cat "$RUNNER_TEMP/r11-webkit-backend.log"' EXIT
          for i in {1..100}; do
            if curl -fsS http://127.0.0.1:8779/health >/dev/null 2>&1; then break; fi
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8779/health
          curl -fsS -X POST http://127.0.0.1:8779/api/employee/save -H 'Content-Type: application/json' -d '{"tab_no":"990001","full_name":"Тестов Иван Иванович","position":"Водитель","unit":"Колонна 1","collection_point":"Тюмень"}'
          curl -fsS -X POST http://127.0.0.1:8779/api/day/save -H 'Content-Type: application/json' -d '{"TabNo":"990001","Date":"2026-11-20","Plan":"1/8","PlanHours":8}'
          curl -fsS -X POST http://127.0.0.1:8779/api/autograf/version/create -H 'Content-Type: application/json' -d '{"tab_no":"990001","year":2026,"label":"Тест до изменения"}'
          curl -fsS -X POST http://127.0.0.1:8779/api/autograf/revision/create -H 'Content-Type: application/json' -d '{"tab_no":"990001","effective_date":"2026-11-01","schedule_type":"","reason":"Исходный график"}'
          timeout 90s xvfb-run -a /usr/bin/python3 port/desktop/tests/webkit_smoke.py
          timeout 60s xvfb-run -a /usr/bin/python3 port/desktop/tests/backup_download_smoke.py
      - name: Check shell without display and library dependencies
        shell: bash
        run: |
          "$RUNNER_TEMP/laborcontrol-r11-desktop/laborcontrol-desktop" --version
          "$RUNNER_TEMP/laborcontrol-r11-desktop/laborcontrol-desktop" --check
          ldd "$RUNNER_TEMP/laborcontrol-r11-desktop/laborcontrol-desktop" | tee "$RUNNER_TEMP/gtk-ldd.txt"
          ! grep -q 'not found' "$RUNNER_TEMP/gtk-ldd.txt"
      - name: Publish experimental desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: laborcontrol-r11-gtk-desktop-amd64-experimental
          path: ${{ runner.temp }}/laborcontrol-r11-desktop/
          if-no-files-found: error
          retention-days: 14
