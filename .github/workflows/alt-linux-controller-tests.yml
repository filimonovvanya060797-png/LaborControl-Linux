# Запуск существующих Go-тестов и сборки контроллера непосредственно на ALT Linux.
# Запускается вручную; не выполняет приложение и не обращается к рабочим базам.
name: ALT Linux — Go tests and build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/r11-core-recovery-20261120
    paths:
      - 'port/controller/**'
      - '.github/workflows/alt-linux-controller-tests.yml'

permissions:
  contents: read

jobs:
  controller-tests:
    name: Go tests and build on ALT Linux
    runs-on: [self-hosted, linux, x64, alt-laborcontrol]
    timeout-minutes: 15
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          clean: true

      - name: Проверить среду
        shell: bash
        run: |
          set -eu
          cat /etc/os-release
          uname -m
          id
          go version

      - name: Запустить Go-тесты контроллера
        working-directory: port/controller
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        shell: bash
        run: |
          set -eu
          go test -count=1 ./...

      - name: Статическая проверка go vet
        working-directory: port/controller
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        shell: bash
        run: |
          set -eu
          go vet ./...

      - name: Собрать Linux-контроллер
        working-directory: port/controller
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
        shell: bash
        run: |
          set -eu
          go build -trimpath -o "$RUNNER_TEMP/laborcontrol-controller" .
          test -x "$RUNNER_TEMP/laborcontrol-controller"
          ls -lh "$RUNNER_TEMP/laborcontrol-controller"

      - name: Проверить кросс-сборку Windows
        working-directory: port/controller
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOOS: windows
          GOARCH: amd64
        shell: bash
        run: |
          set -eu
          go test -c -o "$RUNNER_TEMP/laborcontrol-controller.test.exe" .
          go build -trimpath -o "$RUNNER_TEMP/laborcontrol-controller.exe" .
          ls -lh "$RUNNER_TEMP/laborcontrol-controller.exe"

      - name: Опубликовать бинарник ALT Linux
        uses: actions/upload-artifact@v4
        with:
          name: laborcontrol-r11-state-alt-x86_64
          path: ${{ runner.temp }}/laborcontrol-controller
          if-no-files-found: error
          retention-days: 14
