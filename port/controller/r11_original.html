label><select id="rtab"><option value="">Выберите</option>${empOptions()}</select></div><div><label>С</label><input id="rfrom" type="date"></div><div><label>По</label><input id="rto" type="date"></div><div><label>Тип</label><select id="rtype" onchange="syncRvdRest('rtype','rrest','rrestwrap')"><option value="1">1 — одинарная</option><option value="2">2 — двойная</option></select></div><div id="rrestwrap"><label>День отдыха для РВД-1</label><input id="rrest" type="date"></div><div><label>Примечание</label><input id="rnote"></div></div><div class="actions"><button class="primary" onclick="saveRVD()">Сохранить РВД</button></div></div><div class="panel"><h2>Записи</h2><div class="tablewrap"><table><thead><tr><th>Таб.</th><th>ФИО</th><th>Тип</th><th>Дата РВД</th><th>Отгул</th><th>Примечание</th><th></th></tr></thead><tbody id="rvdrows">${rows||'<tr><td colspan="7" class="muted">В выбранной СЗ РВД записей нет.</td></tr>'}</tbody></table></div></div>`}

function events(){pageTitle('Разукрашка / события','События хранят смысл; цвет — только отображение');let m=empMap(),rows=state.data.events.filter(x=>x.event_type!=='RVD_CANCEL').slice().reverse().map(x=>`<tr><td>${esc(m[x.employee_id]?.tab_no)}</td><td>${esc(m[x.employee_id]?.full_name)}</td><td>${esc(eventMeta[x.event_type]?.name||x.event_type)}</td><td>${esc(x.date_from)} — ${esc(x.date_to)}</td><td>${esc(x.source_code)}</td><td>${esc(x.source)}</td><td>${esc(x.note)}</td><td><button class="tiny" onclick="deleteEvent(${x.id})">Удалить</button></td></tr>`).join('');return `<div class="panel"><h2>Добавить событие</h2><div class="grid"><div><label>Сотрудник</label><select id="vtab"><option value="">Выберите</option>${empOptions()}</select></div><div><label>С</label><input id="vfrom" type="date"></div><div><label>По</label><input id="vto" type="date"></div><div><label>Тип</label><select id="vtype">${Object.entries(eventMeta).map(([k,v])=>`<option value="${k}">${v.name}</option>`).join('')}</select></div><div><label>Код источника</label><input id="vcode" placeholder="2001 / 2004"></div><div><label>Источник</label><input id="vsource"></div></div><label style="margin-top:10px">Примечание</label><input id="vnote"><div class="actions"><button class="primary" onclick="saveEvent()">Сохранить событие</button></div></div><div class="panel"><h2>Импорт событий CSV</h2><div class="filebox"><div><label>CSV: tab_no,date_from,date_to,event_type,source_code,source,note</label><input id="eventfile" type="file" accept=".csv"></div><button class="primary" onclick="upload('/api/import/events','eventfile')">Загрузить</button></div></div><div class="panel"><h2>События</h2><div class="tablewrap"><table><thead><tr><th>Таб.</th><th>ФИО</th><th>Тип</th><th>Даты</th><th>Код</th><th>Источник</th><th>Примечание</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8" class="muted">Пока нет событий.</td></tr>'}</tbody></table></div></div>`}
function jf(){let q=val('jq').toLowerCase(),o=val('jo');document.querySelectorAll('#jrows tr[data-s]').forEach(r=>r.style.display=(!q||r.dataset.s.includes(q))&&(!o||r.dataset.o===o)?'':'none')}

const guideArticles=[
{"id":"employees-gender-import-2026","group":"Сотрудники","title":"Пол и недельная норма: карточка и импорт Excel","intro":"Для вашего предприятия мужчинам задаётся 40 ч/нед., женщинам — 36 ч/нед. Норма сотрудника рассчитывается по производственному календарю и датам трудоустройства, а не по числу часов смены.","steps":["В карточке сотрудника укажите «Пол сотрудника»: «Мужчина» либо «Женщина». Проверьте установленную недельную норму. При документальном исключении укажите другую норму и основание.","В Excel можно добавить колонку «Пол». Поддерживаются М, м, Ж, ж, Мужчина, Женщина. При проверке файла убедитесь, что столбец сопоставлен и в предпросмотре верно показаны пол и норма.","Если у нового сотрудника пол не указан, запись разрешена, но новая недельная норма автоматически не назначается. До расчёта Конструктором её нужно уточнить в карточке.","Если при повторном импорте колонка «Пол» отсутствует или ячейка пустая, уже сохранённые пол и недельная норма сотрудника не изменяются.","Неверное непустое обозначение пола показывается как ошибка импорта; исправьте исходный файл и прочитайте его заново после нажатия «Отмена»."],"note":"Снимки карточки и предпросмотра старой версии в инструкции V9 явно отмечены как архивные; новые ALT-снимки требуются после проверки сборки.","keys":"женщина мужчина М Ж пол эксель импорт 36 40 норма рабочая неделя дата приёма"},
{"id":"autograf-calendar-40-36-2026","group":"АвтоГраф","title":"Производственный календарь: переключение норм 40 и 36 часов","intro":"Вкладка показывает два расчёта по одному и тому же набору праздников и рабочих дней. Переключатель не меняет данные карточек и уже построенные графики.","steps":["Откройте «АвтоГраф → Производственный календарь» и выберите режим: «Мужчины · 40 ч/нед.» или «Женщины · 36 ч/нед.».","Проверьте годовую, месячную нормы, выбранный день, нормы за квартал, произвольный период и таблицу месяцев. В 2026 году для полного года это 1972 ч и 1774,4 ч соответственно.","При необходимости редактируйте даты только один раз. Редактор сохраняет часы БАЗОВОГО календаря 40-часовой недели; 36-часовая норма получается автоматически, включая сокращённые дни.","Чтобы изменить норму конкретного человека, используйте карточку сотрудника. Переключение общего календаря не меняет индивидуальную норму сотрудника.","Перед импортом другого года проверьте, что его календарь заполнен. Отсутствующие дни показываются предупреждением."],"note":"Новый экран с переключателем ещё требует реального ALT-скриншота по утверждённому стилю V7; не использовать синтетическую иллюстрацию.","keys":"производственный календарь женщина мужчина режим 40 36 переключить календарь год квартал месячная норма"},
{"id":"autograf-fractional-hours-2026","group":"АвтоГраф","title":"Ручная корректировка графика: дробные часы","intro":"После построения графика по полётам техник может вручную выставить дробные плановые часы для вывода индивидуального баланса к нулю. Конструктор продолжает использовать выбранные смены 10 или 11 часов.","steps":["Откройте «АвтоГраф → График сотрудника», выберите день и нажмите на ячейку плана.","Введите рабочие часы от 1 до 11: 7,3 или 7.3, 9,2 или 9.2, 7,25; можно указывать до трёх знаков после разделителя. В обозначениях смен допустимы также 1/9.2 и 2/7,25.","Числа означают ДЕСЯТИЧНЫЕ часы: 7,3 ч — это 7 часов 18 минут, а не 7 часов 30 минут. «В» и «ДП» всегда остаются нулевыми плановыми днями.","Нажмите «Сохранить план». Для подробного редактора укажите такое же значение в поле «Часы по графику», используя точку или запятую.","После сохранения проверьте месячный и годовой баланс; повторно откройте день, чтобы убедиться, что дробь не пропала. Протягивайте дробное значение только в нужный диапазон с подтверждением."],"note":"Помощник АвтоГрафа — отдельный инструмент подбора вариантов и будет дорабатываться позже. Конструктор автоматически баланс не подгоняет. Скриншот дробной правки — после реальной ALT-проверки.","keys":"дробные часы план 7.3 7,3 9.2 9,2 7.25 7,25 1/9.2 2/7,25 баланс норма"},
{"id":"autograf-working-free-pair","group":"АвтоГраф","title":"Парные виды графиков: что значит рабочая и свободная вахта","intro":"Два парных вида используют одни и те же согласованные даты полётов. Различается только то, у какого вида первая последовательность рабочая, а у какого свободная. Разберём на «Тюм-Тал-Тюм 9» и «Тюм-Тал-Тюм 9.» — точка в конце здесь имеет значение.","steps":["Рабочая вахта — фаза цикла, когда сотруднику, которому назначен этот вид, планируются рабочие дни. Свободная вахта — противоположная фаза цикла, когда по этому графику не планируются рабочие дни. Это не отпуск и не увольнение.","«Первая последовательность» означает первую из двух чередующихся последовательностей рейсов, начинающуюся от первой опорной ДП. Это не первый день месяца и не выбор часов смены.","Если у «Тюм-Тал-Тюм 9» выбрана «Рабочая», после первой ДП 09.01.2026 начинается рабочая фаза, после второй ДП 30.01.2026 — свободная. Затем чередование продолжается: 27.02.2026 — рабочая, 27.03.2026 — свободная.","У парного «Тюм-Тал-Тюм 9.» всё наоборот: после 09.01.2026 — свободная, после 30.01.2026 — рабочая, затем 27.02.2026 — свободная, 27.03.2026 — рабочая. Оба используют один общий набор согласованных рейсов.","Сам день полёта — ДП, и он учитывается отдельно. Выбор «Рабочая» или «Свободная» указывает фазу периода после соответствующей ДП, а не автоматически 11 часов на сам день полёта.","Чтобы создать новую пару, откройте «АвтоГраф → Согласованные полёты», выберите пункт сбора и конкретный цикл по двум исходным ДП. Нажмите «Создать виды графиков для этого цикла», проверьте названия и противоположные рабочую и свободную фазы, затем подтвердите сохранение. После этого откройте «Виды графиков» и проверьте привязку обоих видов к выбранному циклу.","Если названия парных графиков отличаются номером, проверяйте их принадлежность именно к одному согласованному циклу по исходным ДП. Например, «Сург-Тал-Сург 7» и «Сург-Тал-Сург 16» нельзя считать парой только из-за общего пункта сбора: они могут относиться к разным циклам. Не объединяйте их автоматически.","Если один из двух видов уже существует, вернитесь к карточке его цикла в «Согласованных полётах» и проверьте привязку. Из общего справочника не создавайте дублирующую пару. После сохранения у связанных видов должна отображаться отметка «Пара готова».","Создание пары само по себе не назначает сотруднику вид графика, не меняет согласованные полёты и не создаёт рабочий план. В Конструкторе сначала выбирают сотрудника и его вид, проверяют предварительный расчёт, затем отдельно подтверждают запись."],"note":"«Рабочая / Свободная» — это фаза вахты, а не настройка продолжительности 10/11 часов. Автоматическая точка — только вариант, а не обязательное правило. Партнёра с другим номером выбирайте по действующим правилам, программа не определяет его за вас. Ручная настройка — для более сложных случаев.","keys":"парный график графики виды точка 9 9. рабочая свободная вахта фаза последовательность первый рейс ДП создать оба парный Тюмень новичок"},
{id:'employees-illustrated',group:'Сотрудники',title:'Полная иллюстрированная инструкция · Сотрудники',intro:'Редакция V9: 10 реальных архивных скриншотов LaborControl и актуальные текстовые изменения по полу, импорту и нормам. Новые снимки после проверки ALT Linux. Работает без интернета.',steps:['Выберите главу по оглавлению внутри иллюстрированной инструкции.','Нажмите на скриншот для увеличения.','Используйте пояснения к номерам, чтобы найти нужную кнопку.'],keys:'полная инструкция сотрудники фото снимки скриншоты иллюстрации v9 excel импорт пункты сбора карточка испытательный срок заметка график'},
{id:'start',group:'Начало работы',title:'Как пользоваться инструкцией',intro:'Откройте нужную главу слева или введите слово в строку поиска. Все материалы доступны без интернета.',steps:['Выберите раздел инструкции: сотрудники, пункты сбора, АвтоГраф или общие действия.','Откройте главу: справа появится описание действий по порядку.','Для поиска введите часть названия кнопки или вопрос, например «табельный номер» либо «испытательный срок».','Важные подсказки объясняют, что произойдёт после нажатия.'],keys:'оглавление поиск главы справка навигация'},
{id:'employees-import',group:'Сотрудники',title:'Добавление сотрудников из Excel',intro:'Для массового заведения работников используйте один файл XLSX/CSV и сначала проверяйте предпросмотр.',steps:['Откройте «Сотрудники» → «Импорт сотрудников из файла».','Нажмите «Выбрать файл», выберите Excel/CSV и затем «Проверить файл». Кнопка показывает предварительный просмотр: запись в базу ещё не выполняется.','В Excel обязательны только табельный номер и ФИО. Должность, подразделение, дата приёма и дата увольнения — дополнительные поля: их можно не указывать.','Дата приёма, если указана, сохраняется в карточке сотрудника и учитывается в АвтоГрафе при отображении графика. Если даты нет — сотрудника всё равно можно импортировать.','Столбцы определяются автоматически. При необходимости раскройте «Сопоставление столбцов Excel — изменить при необходимости» и проверьте соответствие.','Проверьте показатели «Новых», «Изменятся», «Уже есть» и «Ошибок».','Если все строки верны и ошибок нет, нажмите «Импортировать новые и изменения» и подтвердите действие.','После записи найдите сотрудников в общем списке.'],note:'Ошибки в предварительном просмотре означают, что ничего не импортировано. Это могут быть строки специального тестового файла. Если нужно загрузить исправленные данные, нажмите «Отмена», измените и сохраните XLSX/CSV, снова выберите его кнопкой «Выбрать файл» и нажмите «Проверить файл».',keys:'импорт кадров excel таблица сотрудники xlsx csv новый файл даты загрузить'},
{id:'employees-import-recheck',group:'Сотрудники',title:'Повторная загрузка файла и изменения',intro:'Повторная загрузка не должна создавать второй экземпляр уже существующего сотрудника.',steps:['Ещё раз выберите тот же файл Excel.','Нажмите «Проверить файл». Если сведения не менялись, в предпросмотре появятся «Уже есть», а показатели «Новых» и «Изменятся» должны быть равны нулю.','Если в Excel были исправлены данные существующего сотрудника, ознакомьтесь с пометкой «Есть изменения».','Записывайте такие изменения только после сверки табельного номера и ФИО.'],keys:'повторное загрузка дубликаты обновление изменения импорт'},
{id:'points-download',group:'Пункты сбора',title:'Скачать и заполнить шаблон пунктов сбора',intro:'Шаблон помогает назначить города сразу нескольким сотрудникам, у которых пункт сбора ещё не заполнен.',steps:['В разделе «Сотрудники» найдите блок «Шаблон пунктов сбора / вылета».','Посмотрите количество в показателе «Без пункта сбора».','Нажмите «Скачать шаблон для Excel» и сохраните файл.','Откройте шаблон в программе для таблиц и заполните столбец «Пункт сбора / вылета».','Не изменяйте табельные номера и ФИО сотрудников; сохраните заполненный файл.'],note:'Скачивание настоящего XLSX во встроенном окне GTK проверяем на обновлённой сборке. Если файл не появился, не считайте скачивание успешным.',keys:'шаблон скачать excel пункт сбора город вылета xlsx csv'},
{id:'points-import',group:'Пункты сбора',title:'Проверить и внести пункты сбора',intro:'Перед записью программа показывает, какие города будут изменены, а какие уже совпадают с карточками.',steps:['Нажмите «Выбрать файл» и укажите заполненный шаблон.','Нажмите «Проверить шаблон».','Сверьте результаты: «Обновятся», «Без изменений», «Не заполнено», «Ошибок».','Проверьте табельные номера, ФИО и пункты сбора. Если есть ошибки — исправьте таблицу.','Если всё правильно, нажмите «Внести пункты сбора» и подтвердите запись.','Убедитесь, что новые города отобразились в общем списке сотрудников.'],note:'Сопоставление идёт по табельному номеру. Другие поля карточки и вид графика не должны изменяться.',keys:'шаблон проверить импорт внести пункт сбора предварительный просмотр'},
{id:'points-errors',group:'Пункты сбора',title:'Что означают ошибки шаблона',intro:'Ошибки в предварительном просмотре сообщают, какие строки необходимо исправить до записи.',steps:['«Пункт не найден в справочнике» — введите допустимый город.','«Повтор табельного» — в файле есть два одинаковых номера; удалите или исправьте дубликат.','«Сотрудник не найден» — проверьте номер в списке сотрудников.','«Нет табельного» — заполните обязательный номер.','«ФИО не совпадает с карточкой» — сверяйте ФИО с правильным сотрудником.','«Пункт не заполнен» — укажите нужный город, если собирались его назначить.'],note:'Не подтверждайте массовое обновление, пока в предпросмотре есть ошибки.',keys:'ошибка неизвестный город неверное фио дубль повтор не найден пустой пункт'},
{id:'card-create',group:'Карточка сотрудника',title:'Создать сотрудника вручную',intro:'Для добавления одного человека Excel не требуется.',steps:['Откройте «Сотрудники» → «Карточка сотрудника».','Введите табельный номер, ФИО, должность, подразделение, пункт сбора и дату приёма.','Выберите вид графика, если он уже есть в справочнике для выбранного пункта сбора.','При необходимости отметьте «Квартальщик», «Испытательный срок» и дату его окончания.','Поле «Примечание» можно оставить пустым либо записать рабочее пояснение.','Нажмите «Сохранить» и проверьте новую строку в общем списке.'],note:'Табельный номер и ФИО обязательны. Дата увольнения действующего сотрудника остаётся пустой.',keys:'карточка сотрудника создать вручную новый табельный ФИО'},
{id:'card-dates',group:'Карточка сотрудника',title:'Ввод, исправление и очистка дат сотрудника',intro:'Дата приёма и дата увольнения поддерживают ручной ввод и выбор через календарь.',steps:['Откройте «Сотрудники», найдите нужную строку и нажмите «Изменить».','В поле «Дата приёма» или «Дата увольнения» наберите восемь цифр без точек, например 01112026. Программа автоматически покажет 01.11.2026. Цифры можно исправлять, удалять Backspace и Delete, выделять и вставлять дату.','Нажмите кнопку со значком календаря рядом с полем, если удобнее выбрать дату мышью.','Чтобы убрать увольнение, нажмите кнопку «×» справа от даты увольнения либо удалите весь текст в поле.','Проверьте другие сведения, нажмите «Сохранить» и ещё раз откройте карточку. У действующего сотрудника дата увольнения должна остаться пустой.'],note:'Кнопка «Очистить» внизу карточки очищает ВСЮ форму; маленький крестик «×» рядом с датой очищает только эту дату. Некорректную дату программа не сохраняет. После установки новой сборки проверьте работу на ALT Linux.',keys:'дата приёма увольнения ручной ввод клавиатура delete backspace удалить символы очистить дату календарь исправить'},
{id:'card-edit',group:'Карточка сотрудника',title:'Изменить существующую карточку',intro:'Изменения в карточке должны сохраняться и учитываться при открытии того же сотрудника в АвтоГрафе.',steps:['Найдите сотрудника в нижнем списке.','Нажмите напротив него «Изменить».','Исправьте необходимые сведения в открывшейся карточке.','Нажмите «Сохранить», затем снова откройте карточку и проверьте значения.','Если меняли вид графика — отдельно проверьте его отображение в АвтоГрафе.'],note:'Кнопка «Очистить» предназначена для очистки формы, а не для удаления сотрудника; поведение всех её полей будет дополнительно проверено.',keys:'редактировать изменить очистить список сохранить график'},
{id:'card-errors',group:'Карточка сотрудника',title:'Ошибки сохранения карточки',intro:'Пояснение к наиболее частым сообщениям в правом нижнем углу.',steps:['«Табельный номер уже существует» — сотрудник с таким номером уже есть. Найдите его в списке и нажмите «Изменить», если нужно исправить сведения.','«Табельный номер и ФИО обязательны» — заполните оба поля, затем сохраните заново.','Если недоступен вид графика — убедитесь, что выбран правильный пункт сбора и в справочнике заведён подходящий тип.','Если дата увольнения раньше даты приёма — исправьте дату.'],note:'Не подбирайте другой табельный номер, если исправляете уже существующего сотрудника: откройте его карточку через «Изменить».',keys:'уже существует табельный номер фио обязательны ошибка сохранить'},
{id:'card-probation',group:'Карточка сотрудника',title:'Испытательный срок и подготовка постоянного графика',intro:'Важное событие должно быть видно прямо на странице сотрудника в АвтоГрафе.',steps:['В карточке включите «Испытательный срок» и укажите дату окончания.','Пока основной график не подготовлен, не включайте «Основной график подготовлен».','Откройте «АвтоГраф» → «График сотрудника». Проверьте дату и предупреждение о приближении окончания срока.','После подготовки постоянного графика обновите статус в карточке и проверьте его в АвтоГрафе.'],note:'По скриншотам ALT Linux проверены предупреждения за 7 дней до окончания, после истечения срока и зелёный статус «Основной график подготовлен». Порог раннего предупреждения и все остальные даты отдельно не проверялись.',keys:'испытательный срок до уведомление предупреждение основной постоянный график'},
{id:'autograf-notes',group:'АвтоГраф',title:'Примечание сотрудника в АвтоГрафе',intro:'Рабочее примечание из карточки должно быть видно при открытии персонального графика сотрудника.',steps:['Введите или исправьте текст в поле «Примечание» карточки сотрудника.','Нажмите «Сохранить».','Откройте «АвтоГраф» → «График сотрудника» и выберите этого сотрудника.','Найдите блок «Примечание сотрудника» над графиком.'],note:'Это примечание относится ко всему сотруднику и не заменяет пометки к отдельным дням. Отображение двух строк примечания №9001 в АвтоГрафе подтверждено скриншотом ALT Linux.',keys:'заметка примечание поле сотрудник автограф график'},
{id:'autograf-cycle-linked-pairs',group:'АвтоГраф',title:'Создание двух парных графиков из одного цикла',intro:'Пара графиков создаётся из конкретного цикла согласованных полётов. Не выбирайте графики разных циклов как пару друг другу.',steps:['Откройте «АвтоГраф → Согласованные полёты».','Найдите карточку нужного цикла: проверьте пункт сбора и две исходные ДП. Например, для Сургута 07.01/29.01 и 16.01/13.02 — это два независимых цикла.','В карточке цикла используйте «Сохранить цикл и два графика» или «Создать виды графиков для этого цикла», если они ещё не созданы.','Откройте «АвтоГраф → Виды графиков» и найдите обе связанные записи. У каждой должен отображаться один и тот же цикл, противоположная первая последовательность и метка «Пара готова».','Используйте Конструктор только после проверки, что выбранному виду соответствует нужный цикл. Новые виды не создаются из старой общей формы.'],note:'При проверке на ALT Linux пары 7/7., 16/16. и 9/9. сохранялись после перезапуска. На новой версии нужен один реальный снимок справочника, где видны колонка цикла и статус пар. Не заменять реальные кадры придумаными изображениями.',keys:'согласованные полеты пара цикл график виды пары 7 16 тюмень'},
{id:'autograf-restore-flight',group:'АвтоГраф',title:'Возврат перенесённого рейса на исходную дату',intro:'Изменяйте один рейс только через карточку нужного цикла. После полного возврата к исходной дате активная отметка переноса должна исчезнуть.',steps:['Откройте «АвтоГраф → Согласованные полёты» и выберите нужный цикл по исходным ДП.','У перенесённого рейса нажмите «Изменить рейс». Укажите исходную дату и причину возврата.','Нажмите «Перенести только этот рейс» и подтвердите одну выбранную дату. Остальные даты не должны измениться.','Убедитесь, что дата восстановлена без подписи «перенос с той же даты», количество рейсов и связанная пара сохранены.','История действий остаётся в журнале. Графики сотрудников не перестраиваются автоматически после одиночной корректировки.'],note:'На старом реальном ALT-скриншоте после возврата 29.01.2026 была ошибка «перенос с 29.01.2026». В исправленной версии она скрывается и активный признак переноса сбрасывается; нужен один контрольный реальный экран после ALT-теста.',keys:'исправление полет рейс перенос возврат к исходной дате журнал'},
{id:'context-menu-ru',group:'Общие действия',title:'Контекстное меню правой кнопкой мыши',intro:'В настольной версии LaborControl для ALT Linux текстовые поля поддерживают обычное контекстное меню на русском языке.',steps:['Откройте любое текстовое поле, например «Дата приёма», «Причина корректировки» или поиск.','Нажмите правую кнопку мыши внутри поля. Появятся команды «Вырезать», «Копировать», «Вставить», «Удалить», «Выделить всё». Доступность команд зависит от выделения и содержимого буфера обмена.','Для ручного ввода даты в формате ДД.ММ.ГГГГ используйте цифровые клавиши или вставку текста. После вставки проверьте итоговую дату: маска даты и проверка корректности продолжают действовать.','В других полях могут присутствовать «Вставить эмодзи» и «Вставить управляющий символ Юникод». Их видимость зависит от возможностей системного WebKitGTK.','Если в меню видны английские названия, проверьте установленную версию программы и сообщите об этом как о замечании — не меняйте системную локаль ради работы LaborControl.'],note:'Иллюстрация правого щелчка должна быть снята непосредственно с ALT Linux после установки проверенной новой сборки. Старый снимок с английским меню сохранён как свидетельство ошибки и не должен использоваться в инструкции в качестве образца исправленной версии.',keys:'русский язык меню правая кнопка мыши контекстное меню копировать вставить вырезать select all copy paste'},
{id:'autograf-personal-hours',group:'АвтоГраф',title:'Норма недели и часы вахтовой смены',intro:'Норма недели и продолжительность одной вахтовой смены — разные параметры. При суммированном учёте сотрудник с нормой 36 ч в неделю может иметь 10-часовые рабочие смены.',steps:['Откройте «Сотрудники» → карточку нужного сотрудника. Убедитесь, что правильно указаны даты приёма и увольнения.','В поле «Установленная рабочая неделя» выберите 40 или 36 часов по документально установленному режиму. Введите основание в соседнем поле.','В поле «Типовая вахтовая смена» выберите 11 или 10 часов, затем сохраните карточку. Пол сотрудника и пункт сбора не подставляют юридическую норму автоматически.','Откройте «АвтоГраф → Конструктор». Выберите сотрудника, вид графика и проверьте поля «Рабочая смена» и «Недельная норма».','При необходимости измените рабочую смену на 10 или 11 часов до расчёта; это не меняет сохранённые данные карточки. Нажмите «Построить по полётам».','В предварительном расчёте проверьте ДП, рабочие и свободные вахты, месячную норму, план и баланс. Дни раньше даты приёма и позже увольнения не должны попадать в запись.','Записывайте график только после проверки данных и резервной копии. При ошибке сохранения не запускайте запись второй раз, пока не проверено фактическое состояние дней.'],note:'Пример по производственному календарю РФ на 2026 год: 40 ч/нед — 1972 ч за полный год, 36 ч/нед — 1774,4 ч. Для работника, принятого 01.11.2026, до 31.12.2026: 335 ч или 301,4 ч соответственно. Ст. 320 ТК РФ предусматривает сокращённую рабочую неделю для женщин, работающих в районах Крайнего Севера и приравненных местностях; основание нужно сверять по документам. Недельная норма — не число часов каждой смены. Реальные скриншоты новой сборки добавим после ALT-проверки; действующие старые кадры не выдаём за новые.',keys:'норма 40 36 часов работник сотрудница 10 11 смена вахта дата приёма конструктор'},
{id:'safety-backup',group:'Общие действия',title:'Резервная копия и безопасное обновление',intro:'Перед массовыми изменениями и установкой новой сборки сохраняйте копию данных.',steps:['Откройте «Настройки» и выберите создание резервной копии.','Дождитесь подтверждения и убедитесь, что файл действительно создан.','Сохраняйте предыдущую рабочую сборку отдельно до проверки новой.','Не используйте настоящую базу Windows для учебных проверок.'],keys:'копия резервная обновление безопасность локально'}
];
let guideSelected='start',guideSearchValue='',guideGroupValue='Все разделы';
function guideAll(){return guideArticles.concat(helpChapters.map((x,i)=>({id:'quick-'+i,group:'Краткие сведения',title:x.title,intro:x.text,steps:[],keys:x.title+' '+x.text})))}
function guideMatch(x,q){let norm=v=>String(v||'').toLocaleLowerCase('ru').replace(/ё/g,'е');let needle=norm(q).trim();let all=norm([x.group,x.title,x.intro,x.keys||'',...(x.steps||[]),x.note||''].join(' '));return !needle||needle.split(/\s+/).every(w=>all.includes(w))}
function guideNav(q=guideSearchValue,group=guideGroupValue){
let available=guideAll().filter(x=>guideMatch(x,q)&&(group==='Все разделы'||x.group===group));
let groups=[...new Set(available.map(x=>x.group))];
return available.length?groups.map(g=>'<div class="lc-help-group"><b>'+esc(g)+'</b>'+available.filter(x=>x.group===g).map(x=>'<button type="button" class="lc-help-link '+(x.id===guideSelected?'active':'')+'" onclick="guideOpen(\''+x.id+'\')">'+esc(x.title)+'</button>').join('')+'</div>').join(''):'<div class="muted">Главы не найдены. Попробуйте другое слово.</div>';
}
function guideArticle(x){
if(!x)return '<div class="muted">Выберите главу в оглавлении слева.</div>';
return '<div class="lc-help-reading"><div class="small muted">'+esc(x.group)+'</div><h2>'+esc(x.title)+'</h2><p>'+esc(x.intro)+'</p>'+(x.steps?.length?'<ol class="lc-help-steps">'+x.steps.map(t=>'<li>'+esc(t)+'</li>').join('')+'</ol>':'')+(x.note?'<div class="info-note">'+esc(x.note)+'</div>':'')+'</div>';
}
function help(){pageTitle('Инструкция','Главы, действия и поиск по всей справке');

let groups=['Все разделы',...new Set(guideAll().map(x=>x.group))];

function lcConfirm(message,options={}){
  return new Promise(resolve=>{
    const title=options.title||'Подтверждение действия';
    const yes=options.accept||'Да';
    const no=options.cancel||'Нет';
    const overlay=document.createElement('div');
    overlay.setAttribute('role','presentation');
    overlay.style.cssText='position:fixed;inset:0;background:rgba(25,38,58,.53);display:flex;align-items:center;justify-content:center;z-index:2147483000;padding:24px';
    const dialog=document.createElement('div');
    dialog.setAttribute('role','dialog');dialog.setAttribute('aria-modal','true');
    dialog.style.cssText='width:min(470px,100%);background:#fff;color:#26364a;padding:22px 24px;border-radius:12px;box-shadow:0 18px 45px #172a4b66;font:inherit';
    const heading=document.createElement('h3');heading.textContent=title;heading.style.cssText='margin:0 0 12px;font-size:18px';
    heading.id='lc-confirm-heading';dialog.setAttribute('aria-labelledby',heading.id);
    const body=document.createElement('p');body.textContent=String(message||'');body.style.cssText='white-space:pre-line;line-height:1.5;margin:0 0 22px';
    const actions=document.createElement('div');actions.style.cssText='display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap';
    const cancel=document.createElement('button');cancel.type='button';cancel.textContent=no;cancel.className='soft';
    const accept=document.createElement('button');accept.type='button';accept.textContent=yes;accept.className=options.danger?'danger':'primary';
    actions.append(cancel,accept);dialog.append(heading,body,actions);overlay.append(dialog);document.body.append(overlay);
    const previous=document.activeElement;
    function finish(answer){document.removeEventListener('keydown',onKey,true);overlay.remove();if(previous&&previous.focus)previous.focus();resolve(answer)}
    function onKey(e){if(e.key==='Escape'){e.preventDefault();finish(false)}}
    document.addEventListener('keydown',onKey,true);
    cancel.addEventListener('click',()=>finish(false));
    accept.addEventListener('click',()=>finish(true));
    cancel.focus();
  });
}

function isFired(e){return !!(e?.fire_date&&e.fire_date<=todayISO())}
function terminationDuringProbation(e){return !!(e?.fire_date&&e?.probation&&e?.probation_end&&e.fire_date<=e.probation_end)}
function employeeLifecycleStatus(e){
if(!e)return null;let td=todayISO(),during=terminationDuringProbation(e);
if(e.fire_date){
if(e.fire_date<=td)return{kind:'neutral',code:'fired',text:`Уволен ${formatDate(e.fire_date)}.${during?' Увольнение во время испытательного срока — основной график не требуется.':''}`};
if(during)return{kind:'warn',code:'planned-fire-probation',text:`Увольнение запланировано на ${formatDate(e.fire_date)} во время испытательного срока. Основной график не требуется.`};
return{kind:'neutral',code:'planned-fire',text:`Увольнение запланировано на ${formatDate(e.fire_date)}.`};
}
if(!e.probation)return null;if(!e.probation_end)return{kind:'bad',code:'probation-missing-date',text:'Испытательный срок включён, но дата его окончания не указана. Проверьте карточку сотрудника.'};
let mr=officialActiveRevision(e),postProb=!!(mr&&String(mr.effective_date||'')>e.probation_end);
if(postProb){let has=state.data.days.some(x=>x.employee_id===e.id&&x.date>=mr.effective_date&&Number(x.plan_hours)>0);return has?{kind:'good',code:'probation-main-active',text:`Испытательный срок завершён ${formatDate(e.probation_end)}. Основной график ведётся в редакции №${revisionDisplayNumber(mr,e)} с ${formatDate(mr.effective_date)}.`}:{kind:'warn',code:'probation-main-empty',text:`Испытательный срок завершён ${formatDate(e.probation_end)}. Редакция основного графика №${revisionDisplayNumber(mr,e)} создана с ${formatDate(mr.effective_date)}, график ещё не заполнен.`}}
let now=new Date(td+'T00:00:00'),end=new Date(e.probation_end+'T00:00:00'),n=Math.ceil((end-now)/86400000);
if(e.main_schedule_ready)return{kind:'good',code:'probation-ready',text:`Испытательный срок до ${formatDate(e.probation_end)} · основной график подготовлен.`};
if(n>14)return{kind:'neutral',code:'probation',text:`Испытательный срок до ${formatDate(e.probation_end)}.`};
if(n>=0)return{kind:'warn',code:'probation-soon',text:`Испытательный срок заканчивается через ${n} дн. (${formatDate(e.probation_end)}). Нужно подготовить основной график.`};
return{kind:'bad',code:'probation-over',text:`Испытательный срок закончился ${Math.abs(n)} дн. назад (${formatDate(e.probation_end)}). Нужно подготовить основной график.`}
}

 let statusText=s?s.text:(e.probation_end?'до '+formatDate(e.probation_end):'дата окончания не указана');
 statusText=String(statusText).replace(/^Испытательный срок\s+/,'');
 out+='<div class="employee-lifecycle '+(s?s.kind:'warn')+'"><div><b>Испытательный срок</b><div>'+esc(statusText)+'</div></div>'+((s&&(s.code==='probation-over'||s.code==='probation-main-empty'))?'<button class="soft" onclick="setAgSection(\'versions\')">Перейти к редакциям</button>':'')+'</div>';

// Карточка: текстовый ввод ДД.ММ.ГГГГ и выбор даты календарём.
// В API и базе по-прежнему используется ISO YYYY-MM-DD; пустое значение разрешено.
function employeeDateISO(raw){
 let v=String(raw||'').trim();if(!v)return '';
 let a=v.match(/^(\d{2})\.(\d{2})\.(\d{4})$/),y,m,d;
 if(a){d=+a[1];m=+a[2];y=+a[3]}else{a=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!a)return null;y=+a[1];m=+a[2];d=+a[3]}
 if(y<1||y>9999||m<1||m>12||d<1||d>31)return null;
 let dt=new Date(Date.UTC(y,m-1,d));
 if(dt.getUTCFullYear()!==y||dt.getUTCMonth()!==m-1||dt.getUTCDate()!==d)return null;
 return String(y).padStart(4,'0')+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')
}
function employeeDateSet(id,iso){
 let hidden=document.getElementById(id),typed=document.getElementById(id+'text'),picker=document.getElementById(id+'picker');
 if(hidden)hidden.value=iso||'';
 if(typed)typed.value=iso?formatDate(iso):'';
 if(picker)picker.value=iso||'';
 if(id==='efire')refreshMainReadyState()
}
// Маска для ввода восьми цифр ДДММГГГГ: точки добавляются без участия пользователя.
// При вставке ISO из других систем поддерживаем и YYYY-MM-DD.
function employeeDateFormatInput(raw){
 let value=String(raw||'');
 if(/^\d{4}-\d{2}-\d{2}$/.test(value))value=value.slice(8,10)+value.slice(5,7)+value.slice(0,4);
 let digits=value.replace(/\D/g,'').slice(0,8);
 if(digits.length<2)return digits;
 if(digits.length<=4)return digits.slice(0,2)+'.'+digits.slice(2)+(digits.length===4?'.':'');
 return digits.slice(0,2)+'.'+digits.slice(2,4)+'.'+digits.slice(4)
}
function employeeDateCaret(text,digitCount){
 if(digitCount<=0)return 0;
 let n=0;
 for(let i=0;i<text.length;i++)if(/\d/.test(text[i])&&++n===digitCount)return text[i+1]==='.'?i+2:i+1;
 return text.length
}
function employeeDateTyped(id){
 let typed=document.getElementById(id+'text');if(!typed)return;
 let raw=typed.value,caret=typed.selectionStart===null?raw.length:typed.selectionStart;
 let before=raw.slice(0,caret).replace(/\D/g,'').length;
 typed.value=employeeDateFormatInput(raw);
 if(typeof typed.setSelectionRange==='function'){let p=employeeDateCaret(typed.value,before);typed.setSelectionRange(p,p)}
 let iso=employeeDateISO(typed.value),hidden=document.getElementById(id),picker=document.getElementById(id+'picker');
 if(hidden)hidden.value=iso===null?'':iso;
 if(picker)picker.value=iso===null?'':iso;
 if(id==='efire')refreshMainReadyState()
}
// Backspace/Delete у автоматической точки удаляет соседнюю цифру, а не «застревает» на разделителе.
function employeeDateKeydown(event,id){
 if(event.key!=='Backspace'&&event.key!=='Delete')return;
 let typed=document.getElementById(id+'text');if(!typed||typed.selectionStart!==typed.selectionEnd)return;
 let pos=typed.selectionStart,raw=typed.value;
 if(!(event.key==='Backspace'&&pos>0&&raw[pos-1]==='.')&&!(event.key==='Delete'&&raw[pos]==='.'))return;
 event.preventDefault();
 let digits=raw.replace(/\D/g,'').split(''),before=raw.slice(0,pos).replace(/\D/g,'').length;
 let index=event.key==='Backspace'?before-1:before;
 if(index<0||index>=digits.length)return;
 digits.splice(index,1);typed.value=employeeDateFormatInput(digits.join(''));
 let p=employeeDateCaret(typed.value,event.key==='Backspace'?before-1:before);
 if(typeof typed.setSelectionRange==='function')typed.setSelectionRange(p,p);
 employeeDateTyped(id)
}
function employeeDateOpenCalendar(id){

}

}

<style id="r11-ru-file-picker-style">
.r11-file-hidden{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important;clip-path:inset(50%)!important;pointer-events:none!important}
.r11-file-button{display:inline-flex;align-items:center;justify-content:center;max-width:100%;padding:7px 12px;border-radius:7px;border:1px solid #b4c2da;background:#f0f4ff;color:#1b345b;font:inherit;cursor:pointer;white-space:nowrap}
.r11-file-button:hover{background:#e1eafe}
.r11-file-button:focus-visible{outline:3px solid #2855d9;outline-offset:2px}
.r11-file-status{display:inline-block;max-width:100%;margin-left:9px;color:#425066;font-size:13px;overflow-wrap:anywhere}
</style>
<script id="r11-ru-file-picker-script">
(function () {
  'use strict';
  const names = {
    empxlsx:'сотрудников', pointxlsx:'пунктов сбора и вылета',
    flxlsx:'рейсов', effile:'полётов сотрудников', eventfile:'событий',
    vacxlsx:'отпусков', calfile6:'производственного календаря',
    factfile:'фактических данных CSV', t2fact:'факта',
    t2szrvd:'СЗ РВД', stateFile:'резервной копии JSON',
    'r11-windows-file':'экспорта Windows R11'
  };
  function enhance(input) {
    if (!input.id || input.dataset.r11PickerReady === '1') return;
    input.dataset.r11PickerReady = '1';
    input.classList.add('r11-file-hidden');
    input.tabIndex = -1;
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'r11-file-button';
    button.textContent = 'Выбрать файл';
    button.setAttribute('aria-controls', input.id);
    button.setAttribute('aria-label', 'Выбрать файл ' + (names[input.id] || 'для загрузки'));
    const status = document.createElement('span');
    status.className = 'r11-file-status';
    status.setAttribute('role', 'status');
    status.setAttribute('aria-live', 'polite');
    const refresh = () => {
      const file = input.files && input.files[0];
      status.textContent = file ? 'Выбран файл: ' + file.name : 'Файл не выбран';
    };
    input.addEventListener('change', refresh);
    button.addEventListener('click', () => input.click());
    input.insertAdjacentElement('afterend', status);
    input.insertAdjacentElement('afterend', button);
    refresh();
  }
  function enhanceInside(node) {
    if (node.nodeType !== 1 && node.nodeType !== 9) return;
    if (node.matches && node.matches('input[type="file"]')) enhance(node);
    node.querySelectorAll('input[type="file"]').forEach(enhance);
  }
  enhanceInside(document);
  // R11 перестраивает экран целиком при смене раздела: новые поля тоже русифицируются.
  const observer = new MutationObserver(records => {
    for (const record of records) for (const node of record.addedNodes) {
      if (node.nodeType !== 1) continue;
      if ((node.matches && node.matches('input[type="file"]')) ||
          (node.querySelector && node.querySelector('input[type="file"]'))) enhanceInside(node);
    }
  });
  observer.observe(document.body || document.documentElement, {childList:true,subtree:true});
  document.addEventListener('reset', event => {
    window.setTimeout(() => {
      event.target.querySelectorAll('input[type="file"]').forEach(input => {
        input.dispatchEvent(new Event('change'));
      });
    }, 0);
  }, true);
})();
</script>

      const digits = s.replace(/\D/g, '');
      if (digits.length !== 8) return null;
      day = digits.slice(0,2);month = digits.slice(2,4);year = digits.slice(4,8);
    }
